[project]
name = "langchain-bot"
version = "0.1.0"
description = "LangChain 1.x capstone - AI e-commerce support agent (Streamlit + SQLite + ChromaDB RAG + Gmail MCP + HITL)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit>=1.40",
    "langchain[mcp]>=1.0",
    "langchain-openai>=1.0",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-community>=0.4",
    "chromadb>=0.5",
    "langchain-chroma>=0.2",
    "langchain-text-splitters>=0.3",
    "langchain-mcp-adapters>=0.1",
    "langchain-anthropic>=1.7.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["src/langchain_bot"]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_bot"]
